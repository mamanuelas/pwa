
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Diarios</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>💰 Control de Gastos</h1>
            <p>Registra y administra tus gastos diarios fácilmente</p>
        </header>

        <!-- Seccion de Resumen -->
        <section class="summary-cards">
            <div class="card">
                <h3>Total Gastado</h3>
                <p id="total-amount">$0.00</p>
            </div>
            <div class="card">
                <h3>Gasto Mayor</h3>
                <p id="max-expense">$0.00</p>
            </div>
            <div class="card">
                <h3>Total Registros</h3>
                <p id="total-count">0</p>
            </div>
        </section>

        <div class="main-content">
            <!-- Formulario para agregar gastos -->
            <section class="form-section">
                <h2>Nuevo Gasto</h2>
                <form id="expense-form">
                    <div class="form-group">
                        <label for="description">Concepto</label>
                        <input type="text" id="description" placeholder="Ej. Almuerzo, Transporte..." required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Monto ($)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Categoría</label>
                        <select id="category" required>
                            <option value="" disabled selected>Selecciona una categoría</option>
                            <option value="Comida">🍔 Comida</option>
                            <option value="Transporte">🚌 Transporte</option>
                            <option value="Hogar">🏠 Hogar</option>
                            <option value="Ocio">🎉 Ocio / Entretenimiento</option>
                            <option value="Salud">💊 Salud</option>
                            <option value="Otros">📦 Otros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Fecha</label>
                        <input type="date" id="date" required>
                    </div>

                    <button type="submit" class="btn-add">Agregar Gasto</button>
                </form>
            </section>

            <!-- Lista y Filtros -->
            <section class="list-section">
                <div class="list-header">
                    <h2>Historial de Gastos</h2>
                    <div class="filter-group">
                        <label for="filter-category">Filtrar:</label>
                        <select id="filter-category">
                            <option value="todas">Todas las categorías</option>
                            <option value="Comida">🍔 Comida</option>
                            <option value="Transporte">🚌 Transporte</option>
                            <option value="Hogar">🏠 Hogar</option>
                            <option value="Ocio">🎉 Ocio</option>
                            <option value="Salud">💊 Salud</option>
                            <option value="Otros">📦 Otros</option>
                        </select>
                    </div>
                </div>

                <ul id="expense-list" class="expense-list">
                    <!-- Los gastos se cargan dinámicamente con JavaScript -->
                </ul>
                
                <p id="empty-msg" class="empty-msg">No hay gastos registrados.</p>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
